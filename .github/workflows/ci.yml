name: CI

on:
  push:
    branches:
  pull_request:

permissions:
  contents: read

jobs:
  build-lowest-version:
    name: Build lowest version
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/hypervel/components-ci:php8.4-swoole6.3.0-rc1

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: composer update --no-interaction --prefer-stable --prefer-lowest --no-progress

      - name: Run tests
        run: vendor/bin/phpunit 

  build:
    name: Build
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/hypervel/components-ci:php${{ matrix.php }}-swoole6.3.0-rc1
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: composer update --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit 
