name: Static analysis

on:
  push:
    branches:
  pull_request:

permissions:
  contents: read

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/hypervel/components-ci:php8.4-swoole6.3.0-rc1

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download dependencies
        run: composer update --no-interaction --no-progress

      - name: Download PHPStan
        run: composer bin phpstan update --no-interaction --no-progress

      - name: Execute PHPStan
        run: vendor/bin/phpstan analyze --no-progress

  php-cs-fixer:
    name: PHP-CS-Fixer
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/hypervel/components-ci:php8.4-swoole6.3.0-rc1

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download dependencies
        run: composer update --no-interaction --no-progress

      - name: Download PHP CS Fixer
        run: composer bin php-cs-fixer update --no-interaction --no-progress

      - name: Execute PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix --diff --dry-run

  composer-normalize:
    name: Composer Normalize
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/hypervel/components-ci:php8.4-swoole6.3.0-rc1

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Execute Composer Normalize
        run: make static-composer-normalize-check
